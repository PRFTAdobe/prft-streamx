<div class="w-full max-w-md">
    <div class="text-center mb-8">
        <a class="inline-flex items-center space-x-2" href="/" data-discover="true">
            <img src="/lovable-uploads/e28b065d-d846-414d-a643-39e0b7ae9309.png" alt="LumaX Logo" class="h-10 w-10">
            <span class="text-2xl font-bold text-dsg-red">Luma X</span>
        </a>
    </div>
    <div class="rounded-lg border bg-card text-card-foreground shadow-sm">
        <div class="flex flex-col space-y-1.5 p-6 text-center">
            <h3 class="tracking-tight text-2xl font-bold">Welcome Back</h3>
            <p class="text-sm text-muted-foreground">Sign in to your account to continue</p>
        </div>
        <div class="p-6 pt-0">
            <form class="space-y-4">
                <div class="space-y-2">
                    <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="email">Email</label>
                    <input type="email" id="email" name="email" required="" placeholder="john@example.com" value=""
                        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm">
                    </div>
                <div class="space-y-2">
                    <label class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70" for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" value=""
                        class="flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-base ring-offset-background file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-foreground placeholder:text-muted-foreground focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 md:text-sm">
                </div>
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <button type="button" role="checkbox" aria-checked="false" value="on" id="rememberMe"
                            class="peer h-4 w-4 shrink-0 rounded-xs border border-primary ring-offset-background focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50 data-[state=checked]:bg-primary data-[state=checked]:text-primary-foreground">
                        </button>
                        <input type="checkbox" aria-hidden="true" tabindex="-1" value="on"
                            style="transform: translateX(-100%); position: absolute; pointer-events: none; opacity: 0; margin: 0px; width: 16px; height: 16px;">
                            <label class="font-medium peer-disabled:cursor-not-allowed peer-disabled:opacity-70 text-sm" for="rememberMe">Remember me</label>
                    </div>
                    <!--a class="text-sm text-dsg-red hover:underline" href="/forgot-password" data-discover="true">Forgot password?</a-->
                </div>
                <button class="inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 [&amp;_svg]:pointer-events-none [&amp;_svg]:size-4 [&amp;_svg]:shrink-0 text-primary-foreground h-10 px-4 py-2 w-full bg-dsg-red hover:bg-dsg-red/90"
                    type="submit">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-log-in mr-2 h-4 w-4">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" x2="3" y1="12" y2="12"></line>
                    </svg>
                    Sign In
                </button>
            </form>
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">Don't have an account? 
                    <button type="button" class="text-dsg-red hover:underline font-medium">Sign Up</button>
                </p>
            </div>
            <div class="mt-4 text-center">
                <a class="text-sm text-gray-500 hover:text-dsg-red transition-colors" href="/" data-discover="true">← Back to Store</a>
            </div>
        </div>
    </div>
</div>
